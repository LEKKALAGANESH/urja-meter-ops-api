[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live: hits the real Urja portal; requires credentials. Deselected by default.
addopts = -q --strict-markers -m "not live"
filterwarnings =
    ignore::DeprecationWarning
    # starlette 1.x deprecates httpx in its TestClient in favour of httpx2. Recorded
    # rather than silenced globally: when FastAPI's TestClient migrates, this line is the
    # reminder to move with it.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
