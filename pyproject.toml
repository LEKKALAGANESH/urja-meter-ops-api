[project]
name = "flock-energy-api"
version = "1.0.0"
description = "A clean REST API over the legacy Urja Meter Ops portal"
requires-python = ">=3.11"
# Runtime dependencies, kept in lockstep with requirements.txt. Declared here too because a
# host that installs from pyproject.toml (e.g. Vercel's Python/FastAPI preset) would otherwise
# install the app package with NO dependencies - the build still passes (it only compiles
# bytecode) but every request then crashes at import with ModuleNotFoundError: fastapi.
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.38.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.7.1",
    "starlette==1.3.1",
]

# Declare the build backend and the single package explicitly. Without this, a host that runs
# `pip install .` (e.g. Vercel) hits setuptools' flat-layout "multiple top-level packages
# discovered" error - app/, scripts/, tests/ all look like packages - and the build fails.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# Vercel: load the FastAPI instance explicitly, so the serverless build never has to guess
# between candidate entrypoints. Resolves to the `app` object in app/main.py.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends()/Query() in defaults is the documented idiom.
    "RUF012",  # Pydantic/FastAPI class attrs do not need ClassVar annotations.
    "N818",    # Portal* exception names already read as errors; the suffix adds noise.
    "UP042",   # str+Enum keeps pydantic v2 serialisation explicit and predictable.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
